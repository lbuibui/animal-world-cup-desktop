name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm test:shared

      - run: pnpm build
        env:
          # Public online config — inlined at build time. Desktop installs from
          # GitHub Releases must connect to the public relay, not the LAN one.
          NEXT_PUBLIC_ONLINE_SERVICE_URL: https://animal-cup-online.linyuan.uk
          NEXT_PUBLIC_APP_URL: https://animal-cup.linyuan.uk

      - run: pnpm exec electron-builder --${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
